<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addodante Hub | Daily Expense Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    :root {
      --bg-body: #f4f6f8;
      --bg-card: #ffffff;
      --text-main: #2d3748;
      --text-sub: #718096;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
      --input-border: #cbd5e0;
      --pro-bg: #f0fdf4;
      --pro-border: #bbf7d0;
    }

    [data-theme="dark"] {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
      --input-border: #475569;
      --pro-bg: #064e3b;
      --pro-border: #047857;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
    body { background: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; padding: 20px; margin: 0; }
    
    .app-container { background: var(--bg-card); border-radius: 12px; padding: 24px; width: 100%; max-width: 800px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    
    /* Dedicated Top Bar for Theme Toggle to avoid overlapping */
    .top-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .theme-toggle-btn {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 16px; margin-bottom: 20px; }
    .header h1 { margin: 0; color: #3182ce; font-size: 1.8rem; }
    .header p { margin: 4px 0 0 0; font-size: 0.9rem; color: var(--text-sub); }

    .summary-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .card { background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; text-align: center; }
    .card h3 { margin: 0 0 4px 0; font-size: 0.8rem; color: var(--text-sub); }
    .card p { margin: 0; font-size: 1.1rem; font-weight: bold; }
    .card.income p { color: #38a169; }
    .card.expense p { color: #e53e3e; }
    .card.balance p { color: #3182ce; }

    .form-section { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 20px; }
    @media (max-width: 600px) { .form-section { grid-template-columns: 1fr; } .summary-cards { grid-template-columns: 1fr; } }

    input, select, button { padding: 10px; border-radius: 6px; font-size: 0.95rem; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); }
    button.btn-add { background: #3182ce; color: white; border: none; font-weight: bold; cursor: pointer; }
    button.btn-add:hover { background: #2b6cb0; }

    .transactions-list { list-style: none; padding: 0; margin: 0 0 20px 0; max-height: 200px; overflow-y: auto; }
    .transaction-item { background: var(--input-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .transaction-item.income-item { border-left: 4px solid #38a169; }
    .transaction-item.expense-item { border-left: 4px solid #e53e3e; }

    .chart-container { margin-bottom: 20px; height: 220px; }
    
    .actions-bar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
    .btn-secondary { background: #718096; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; }

    .pro-banner { background: var(--pro-bg); border: 1px solid var(--pro-border); padding: 16px; border-radius: 8px; text-align: center; }
    .pro-banner h3 { margin: 0 0 4px 0; color: #3182ce; }
    .pro-banner p { margin: 0 0 12px 0; font-size: 0.85rem; color: var(--text-sub); }
    .btn-pro { background: #38a169; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">🌙 Dark Mode</button>
    </div>

    <!-- Header -->
    <div class="header">
      <h1>Addodante Hub</h1>
      <p>Daily Expense Tracker & Budget Planner</p>
    </div>

    <div class="summary-cards">
      <div class="card income"><h3>Income</h3><p id="total-income">GHS 0.00</p></div>
      <div class="card expense"><h3>Expenses</h3><p id="total-expense">GHS 0.00</p></div>
      <div class="card balance"><h3>Net Balance</h3><p id="net-balance">GHS 0.00</p></div>
    </div>

    <div class="form-section">
      <input type="text" id="desc" placeholder="Description (e.g. Salary, Food)">
      <input type="number" id="amount" placeholder="Amount (GHS)">
      <select id="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
      <button class="btn-add" onclick="addTransaction()">+ Add</button>
    </div>

    <ul class="transactions-list" id="tx-list"></ul>

    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>

    <div class="actions-bar">
      <button class="btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
      <button class="btn-secondary" style="background:#e53e3e;" onclick="clearAll()">🗑️ Clear All</button>
    </div>

    <div class="pro-banner">
      <h3>🚀 Addodante Pro Analytics</h3>
      <p>Get automated monthly PDF reports & automated receipt sync for GHS 5.00/mo.</p>
      <button class="btn-pro" onclick="payPro()">Upgrade via Paystack (GHS 5)</button>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('addodante_txs')) || [];
    let chartInstance = null;
    const PAYSTACK_KEY = 'pk_test_e6b5b083a6e98d434bd33ec8ed7efbc699d66297';

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', targetTheme);
      localStorage.setItem('theme', targetTheme);
      document.getElementById('theme-btn').innerText = targetTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-btn').innerText = savedTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';

    function updateUI() {
      const list = document.getElementById('tx-list');
      list.innerHTML = '';

      let inc = 0, exp = 0;

      transactions.forEach((tx, idx) => {
        if (tx.type === 'income') inc += tx.amount;
        else exp += tx.amount;

        const li = document.createElement('li');
        li.className = `transaction-item ${tx.type}-item`;
        li.innerHTML = `
          <span><strong>${tx.desc}</strong> (${tx.type})</span>
          <span>GHS ${tx.amount.toFixed(2)} 
            <button onclick="deleteTx(${idx})" style="border:none; background:none; color:#e53e3e; cursor:pointer; font-weight:bold; margin-left:8px;">×</button>
          </span>
        `;
        list.appendChild(li);
      });

      document.getElementById('total-income').innerText = `GHS ${inc.toFixed(2)}`;
      document.getElementById('total-expense').innerText = `GHS ${exp.toFixed(2)}`;
      document.getElementById('net-balance').innerText = `GHS ${(inc - exp).toFixed(2)}`;

      localStorage.setItem('addodante_txs', JSON.stringify(transactions));
      renderChart(inc, exp);
    }

    function addTransaction() {
      const desc = document.getElementById('desc').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;

      if (!desc || isNaN(amount) || amount <= 0) {
        alert("Please provide a valid description and amount.");
        return;
      }

      transactions.push({ desc, amount, type });
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
      updateUI();
    }

    function deleteTx(idx) {
      transactions.splice(idx, 1);
      updateUI();
    }

    function clearAll() {
      if (confirm("Clear all recorded transactions?")) {
        transactions = [];
        updateUI();
      }
    }

    function renderChart(inc, exp) {
      const ctx = document.getElementById('expenseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Income', 'Expenses'],
          datasets: [{
            data: [inc, exp],
            backgroundColor: ['#38a169', '#e53e3e']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    function exportCSV() {
      if (transactions.length === 0) return alert("No transactions to export.");
      let csv = "Description,Amount,Type\n";
      transactions.forEach(t => csv += `"${t.desc}",${t.amount},${t.type}\n`);
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Addodante_Expense_Report.csv';
      a.click();
    }

    function payPro() {
      let email = prompt("Enter your email for Addodante Pro activation:");
      if (!email) return;

      let handler = PaystackPop.setup({
        key: PAYSTACK_KEY,
        email: email,
        currency: 'GHS',
        amount: 5 * 100,
        callback: function(res) {
          alert("Payment Successful! Ref: " + res.reference);
        }
      });
      handler.openIframe();
    }

    updateUI();
  </script>
</body>
</html>
