<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Budget & Income Tracker</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Paystack Inline JS CDN -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f4f7f6; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .card { background: #ffffff; border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1a202c; font-size: 1.5rem; text-align: center; }
    
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-box { padding: 12px; border-radius: 8px; text-align: center; color: white; }
    .stat-box h4 { margin: 0 0 4px 0; font-size: 0.75rem; text-transform: uppercase; opacity: 0.9; }
    .stat-box p { margin: 0; font-size: 1.1rem; font-weight: bold; }
    .bg-income { background: #38a169; }
    .bg-expense { background: #e53e3e; }
    
    .balance-box { background: #2b6cb0; color: #ffffff; padding: 14px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    .balance-box h3 { margin: 0 0 4px 0; font-size: 0.85rem; opacity: 0.9; text-transform: uppercase; }
    .balance-box p { margin: 0; font-size: 1.6rem; font-weight: bold; }

    .chart-container { position: relative; margin: 20px 0; width: 100%; max-height: 220px; display: flex; justify-content: center; }

    .form-group { margin-bottom: 12px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.95rem; background: #fff; }
    button { width: 100%; padding: 12px; background: #38a169; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    button:hover { opacity: 0.95; }
    .export-btn { background: #3182ce; }
    .paystack-btn { background: #0ba4db; }
    .clear-btn { background: #e53e3e; }
    
    .pay-section { border-top: 2px dashed #e2e8f0; margin-top: 20px; padding-top: 16px; }
    .pay-section h3 { margin: 0 0 10px 0; font-size: 1rem; color: #2d3748; text-align: center; }

    ul { list-style: none; padding: 0; margin-top: 20px; max-height: 200px; overflow-y: auto; }
    li { display: flex; justify-content: space-between; align-items: center; background: #edf2f7; padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 0.9rem; }
    .details { display: flex; flex-direction: column; }
    .tag { font-size: 0.75rem; color: #4a5568; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; width: fit-content; }
    .amount-income { font-weight: bold; color: #38a169; }
    .amount-expense { font-weight: bold; color: #e53e3e; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Budget Tracker</h2>
    
    <div class="balance-box">
      <h3>Net Balance</h3>
      <p id="net-balance">GHS 0.00</p>
    </div>

    <div class="dashboard">
      <div class="stat-box bg-income">
        <h4>Total Income</h4>
        <p id="total-income">GHS 0.00</p>
      </div>
      <div class="stat-box bg-expense">
        <h4>Total Spent</h4>
        <p id="total-expense">GHS 0.00</p>
      </div>
    </div>

    <div class="form-group">
      <select id="type">
        <option value="expense">Expense (-)</option>
        <option value="income">Income (+)</option>
      </select>
    </div>
    <div class="form-group">
      <input type="text" id="item" placeholder="Description (e.g., Salary, MoMo cashout)">
    </div>
    <div class="form-group">
      <input type="number" id="cost" placeholder="Amount (GHS)">
    </div>
    <div class="form-group">
      <select id="category">
        <option value="Mobile Money (MoMo)">Mobile Money (MoMo)</option>
        <option value="Cash">Cash</option>
        <option value="Bank Transfer">Bank Transfer</option>
        <option value="Card">Card</option>
      </select>
    </div>
    <button onclick="addTransaction()">Add Entry</button>
    <button class="export-btn" onclick="exportToCSV()">Export to CSV (Excel)</button>

    <!-- Paystack Payment Integration -->
    <div class="pay-section">
      <h3>Support / Pay via MoMo or Card</h3>
      <div class="form-group">
        <input type="email" id="email-address" placeholder="Enter your email address" required />
      </div>
      <div class="form-group">
        <input type="number" id="pay-amount" placeholder="Payment Amount (GHS)" value="10" />
      </div>
      <button class="paystack-btn" onclick="payWithPaystack()">Pay with Paystack</button>
    </div>

    <button class="clear-btn" style="margin-top: 16px;" onclick="clearAllData()">Clear All History</button>

    <!-- Visual Chart -->
    <div class="chart-container">
      <canvas id="financeChart"></canvas>
    </div>

    <ul id="list"></ul>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('my_transactions')) || [];
    let myChart = null;

    // YOUR TEST PUBLIC KEY FROM PAYSTACK DASHBOARD
    const PAYSTACK_PUBLIC_KEY = 'pk_test_e6b5b083a6e98d434bd33ec8ed7efbc699d66297';

    window.onload = function() {
      updateUI();
    };

    function addTransaction() {
      const typeInput = document.getElementById('type');
      const itemInput = document.getElementById('item');
      const costInput = document.getElementById('cost');
      const categoryInput = document.getElementById('category');
      
      const type = typeInput.value;
      const itemText = itemInput.value.trim();
      const costAmount = parseFloat(costInput.value);
      const categoryText = categoryInput.value;

      if (itemText === '' || isNaN(costAmount) || costAmount <= 0) {
        alert('Please enter a valid description and amount.');
        return;
      }

      transactions.unshift({
        type: type,
        text: itemText,
        amount: costAmount,
        category: categoryText
      });

      localStorage.setItem('my_transactions', JSON.stringify(transactions));

      updateUI();

      itemInput.value = '';
      costInput.value = '';
    }

    function updateUI() {
      const listElement = document.getElementById('list');
      const totalIncomeElement = document.getElementById('total-income');
      const totalExpenseElement = document.getElementById('total-expense');
      const netBalanceElement = document.getElementById('net-balance');
      
      listElement.innerHTML = '';
      let totalIncome = 0;
      let totalExpense = 0;

      transactions.forEach(t => {
        if (t.type === 'income') {
          totalIncome += t.amount;
        } else {
          totalExpense += t.amount;
        }

        const li = document.createElement('li');
        const isIncome = t.type === 'income';
        const amountClass = isIncome ? 'amount-income' : 'amount-expense';
        const sign = isIncome ? '+' : '-';

        li.innerHTML = `
          <div class="details">
            <strong>${t.text}</strong>
            <span class="tag">${t.category || 'General'}</span>
          </div>
          <span class="${amountClass}">${sign} GHS ${t.amount.toFixed(2)}</span>
        `;
        listElement.appendChild(li);
      });

      const netBalance = totalIncome - totalExpense;

      totalIncomeElement.innerText = 'GHS ' + totalIncome.toFixed(2);
      totalExpenseElement.innerText = 'GHS ' + totalExpense.toFixed(2);
      netBalanceElement.innerText = 'GHS ' + netBalance.toFixed(2);

      if (netBalance < 0) {
        netBalanceElement.style.color = '#feb2b2';
      } else {
        netBalanceElement.style.color = '#ffffff';
      }

      renderChart(totalIncome, totalExpense);
    }

    function renderChart(income, expense) {
      const ctx = document.getElementById('financeChart').getContext('2d');
      
      if (myChart) {
        myChart.destroy();
      }

      myChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Income', 'Expenses'],
          datasets: [{
            data: [income, expense],
            backgroundColor: ['#38a169', '#e53e3e'],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom'
            }
          }
        }
      });
    }

    function payWithPaystack() {
      const email = document.getElementById('email-address').value.trim();
      const amountGHS = parseFloat(document.getElementById('pay-amount').value);

      if (!email) {
        alert('Please enter your email address.');
        return;
      }

      if (isNaN(amountGHS) || amountGHS <= 0) {
        alert('Please enter a valid amount.');
        return;
      }

      let handler = PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,
        email: email,
        currency: 'GHS',
        amount: amountGHS * 100, // Amount in pesewas
        ref: 'TRX_' + Math.floor((Math.random() * 1000000000) + 1),
        onClose: function() {
          alert('Window closed.');
        },
        callback: function(response) {
          alert('Payment successful! Transaction Reference: ' + response.reference);
        }
      });

      handler.openIframe();
    }

    function exportToCSV() {
      if (transactions.length === 0) {
        alert('No data recorded to export!');
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,Type,Description,Category,Amount (GHS)\n";

      transactions.forEach(t => {
        csvContent += `"${t.type}","${t.text}","${t.category || 'General'}",${t.amount.toFixed(2)}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "financial_summary.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function clearAllData() {
      if (confirm('Are you sure you want to clear all saved transactions?')) {
        transactions = [];
        localStorage.removeItem('my_transactions');
        updateUI();
      }
    }
  </script>

</body>
</html>
