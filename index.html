<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Expense Tracker</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f4f7f6; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .card { background: #ffffff; border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1a202c; font-size: 1.5rem; text-align: center; }
    .balance-box { background: #3182ce; color: #ffffff; padding: 16px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    .balance-box h3 { margin: 0 0 4px 0; font-size: 0.9rem; opacity: 0.9; text-transform: uppercase; }
    .balance-box p { margin: 0; font-size: 1.8rem; font-weight: bold; }
    .form-group { margin-bottom: 12px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.95rem; background: #fff; }
    button { width: 100%; padding: 12px; background: #38a169; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    button:hover { background: #2f855a; }
    .clear-btn { background: #e53e3e; }
    .clear-btn:hover { background: #c53030; }
    ul { list-style: none; padding: 0; margin-top: 20px; max-height: 220px; overflow-y: auto; }
    li { display: flex; justify-content: space-between; align-items: center; background: #edf2f7; padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 0.9rem; }
    .details { display: flex; flex-direction: column; }
    .tag { font-size: 0.75rem; color: #4a5568; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; width: fit-content; }
    .amount { font-weight: bold; color: #e53e3e; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Expense Tracker</h2>
    <div class="balance-box">
      <h3>Total Spent</h3>
      <p id="total">GHS 0.00</p>
    </div>

    <div class="form-group">
      <input type="text" id="item" placeholder="Expense description (e.g., Data bundle)">
    </div>
    <div class="form-group">
      <input type="number" id="cost" placeholder="Amount (GHS)">
    </div>
    <div class="form-group">
      <select id="category">
        <option value="Mobile Money (MoMo)">Mobile Money (MoMo)</option>
        <option value="Cash">Cash</option>
        <option value="Bank Transfer">Bank Transfer</option>
        <option value="Card">Card</option>
      </select>
    </div>
    <button onclick="addExpense()">Add Expense</button>
    <button class="clear-btn" onclick="clearAllExpenses()">Clear All History</button>

    <ul id="list"></ul>
  </div>

  <script>
    let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];

    window.onload = function() {
      updateUI();
    };

    function addExpense() {
      const itemInput = document.getElementById('item');
      const costInput = document.getElementById('cost');
      const categoryInput = document.getElementById('category');
      
      const itemText = itemInput.value.trim();
      const costAmount = parseFloat(costInput.value);
      const categoryText = categoryInput.value;

      if (itemText === '' || isNaN(costAmount) || costAmount <= 0) {
        alert('Please enter a valid description and amount.');
        return;
      }

      expenses.unshift({ text: itemText, amount: costAmount, category: categoryText });
      localStorage.setItem('my_expenses', JSON.stringify(expenses));

      updateUI();

      itemInput.value = '';
      costInput.value = '';
    }

    function updateUI() {
      const listElement = document.getElementById('list');
      const totalElement = document.getElementById('total');
      
      listElement.innerHTML = '';
      let totalSpent = 0;

      expenses.forEach(expense => {
        totalSpent += expense.amount;
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="details">
            <strong>${expense.text}</strong>
            <span class="tag">${expense.category || 'General'}</span>
          </div>
          <span class="amount">- GHS ${expense.amount.toFixed(2)}</span>
        `;
        listElement.appendChild(li);
      });

      totalElement.innerText = 'GHS ' + totalSpent.toFixed(2);
    }

    function clearAllExpenses() {
      if (confirm('Are you sure you want to clear all saved expenses?')) {
        expenses = [];
        localStorage.removeItem('my_expenses');
        updateUI();
      }
    }
  </script>

</body>
</html>
